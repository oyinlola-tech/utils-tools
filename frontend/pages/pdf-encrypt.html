  <body>

    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">PDF tool</span>
            <h1>Password Protect PDF</h1>
            <p class="hero-description">Encrypt your PDF document with a password.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>

                  <label for="pdf-password">User Password</label>
                  <input type="password" id="pdf-password" class="text-input" placeholder="Enter password to open document" />

              </div>
            </div>
            <button type="button" class="primary-button tool-run" id="tool-run">Protect PDF</button>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
