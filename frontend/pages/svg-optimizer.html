<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f6f0" />
    <meta name="description" content="Minify SVG markup by stripping comments and whitespace and rounding numbers, without changing how it looks." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tools.oyinlola.site/tools/svg-optimizer" />
    <meta property="og:title" content="SVG Optimizer - Utils-tool" />
    <meta property="og:description" content="Minify SVG markup by stripping comments and whitespace and rounding numbers, without changing how it looks." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Utils-tool" />
    <meta property="og:url" content="https://tools.oyinlola.site/tools/svg-optimizer" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>SVG Optimizer - Utils-tool</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/brand/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/brand/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <script type="module" src="/static/assets/js/error-boundary.js"></script>
    <link rel="stylesheet" href="/static/assets/css/reset.css" />
    <link rel="stylesheet" href="/static/assets/css/variables.css" />
    <link rel="stylesheet" href="/static/assets/css/base.css" />
    <link rel="stylesheet" href="/static/assets/css/components.css" />
    <link rel="stylesheet" href="/static/assets/css/shell.css" />
    <link rel="stylesheet" href="/static/assets/css/workbench.css" />
    <link rel="stylesheet" href="/static/assets/css/responsive.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Developer tool</span>
            <h1>Optimize SVG files.</h1>
            <p class="hero-description">Minify SVG markup by stripping comments and whitespace and rounding numbers, without changing how it looks.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            
            <div id="tool-upload" data-accept=".svg,image/svg+xml" data-multiple="false" data-max-files="1" data-hint="SVG up to 10 MB"></div>
        
            <div class="tool-options" id="tool-options">
<div class="option-row">
              <div class="option-field">
                <label for="precision">Number precision</label>
                <select id="precision" class="select-input">
                  <option value="0">0 decimals</option>
                  <option value="1">1 decimal</option>
                  <option value="2" selected>2 decimals</option>
                  <option value="-1">Keep as-is</option>
                </select>
              </div>
            </div>
        
            </div>
            <button type="button" class="primary-button tool-run" id="tool-run">Optimize SVG</button>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/static/assets/js/pages/svg-optimizer.js"></script>
    <script defer src="/static/assets/js/vercel-analytics.js"></script>
  </body>
</html>
