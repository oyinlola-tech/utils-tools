  <body>

    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Developer tool</span>
            <h1>UUID &amp; ULID Generator</h1>
            <p class="hero-description">Generate random UUID v4, time-ordered UUID v7 or ULID identifiers in bulk. Created with your browser's secure random generator.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            <div class="tool-options" id="tool-options">
              <div class="option-row">
                <div class="option-field">
                  <label for="uuid-kind">Type</label>
                  <select id="uuid-kind" class="select-input">
                    <option value="v4" selected>UUID v4 (random)</option>
                    <option value="v7">UUID v7 (time-ordered)</option>
                    <option value="ulid">ULID (time-ordered, 26 chars)</option>
                    <option value="nil">Nil UUID</option>
                  </select>
                </div>
                <div class="option-field">
                  <label for="uuid-count">How many (1-1000)</label>
                  <input id="uuid-count" type="number" min="1" max="1000" value="10" inputmode="numeric" />
                </div>
              </div>
              <div class="option-row">
                <label class="toggle">
                  <input id="uuid-upper" type="checkbox" />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">Uppercase</span>
                </label>
                <label class="toggle">
                  <input id="uuid-hyphens" type="checkbox" checked />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">Hyphens</span>
                </label>
                <label class="toggle">
                  <input id="uuid-braces" type="checkbox" />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">Braces { }</span>
                </label>
              </div>
              <div class="option-field">
                <label for="uuid-output">Generated IDs</label>
                <textarea id="uuid-output" class="code-output" rows="12" readonly spellcheck="false"></textarea>
                <small id="uuid-meta" aria-live="polite"></small>
              </div>
              <div class="result-actions">
                <button type="button" class="primary-button" id="uuid-generate">Generate new</button>
                <button type="button" class="secondary-button" id="uuid-copy">Copy</button>
              </div>
            </div>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
