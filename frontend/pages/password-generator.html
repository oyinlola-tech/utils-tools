  <body>

    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Developer tool</span>
            <h1>Password Generator</h1>
            <p class="hero-description">Create strong random passwords or memorable passphrases with your browser's cryptographic random generator. Nothing is stored or sent anywhere.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            <div class="tool-options" id="tool-options">
              <div class="option-field">
                <span class="option-label" id="pw-mode-label">Type</span>
                <div class="segmented" role="group" aria-labelledby="pw-mode-label" id="pw-mode">
                  <button type="button" data-value="password" class="active">Password</button>
                  <button type="button" data-value="passphrase">Passphrase</button>
                </div>
              </div>
              <div id="pw-password-options" class="option-field">
                <div class="option-row">
                  <div class="option-field">
                    <label for="pw-length">Length (4-128)</label>
                    <input id="pw-length" type="number" min="4" max="128" value="20" inputmode="numeric" />
                  </div>
                  <div class="option-field">
                    <label for="pw-length-range">Adjust length</label>
                    <input id="pw-length-range" type="range" min="4" max="128" value="20" />
                  </div>
                </div>
                <div class="option-row">
                  <label class="toggle">
                  <input id="pw-lower" type="checkbox" checked />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">Lowercase a-z</span>
                </label>
                  <label class="toggle">
                  <input id="pw-upper" type="checkbox" checked />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">Uppercase A-Z</span>
                </label>
                  <label class="toggle">
                  <input id="pw-digits" type="checkbox" checked />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">Digits 0-9</span>
                </label>
                  <label class="toggle">
                  <input id="pw-symbols" type="checkbox" checked />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">Symbols !@#</span>
                </label>
                  <label class="toggle">
                  <input id="pw-ambiguous" type="checkbox" />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">Avoid look-alikes (l 1 O 0)</span>
                </label>
                </div>
              </div>
              <div id="pw-phrase-options" class="option-field hidden">
                <div class="option-row">
                  <div class="option-field">
                    <label for="pw-words">Words (3-12)</label>
                    <input id="pw-words" type="number" min="3" max="12" value="5" inputmode="numeric" />
                  </div>
                  <div class="option-field">
                    <label for="pw-separator">Separator</label>
                    <select id="pw-separator" class="select-input">
                      <option value="-" selected>Hyphen (-)</option>
                      <option value=" ">Space</option>
                      <option value=".">Period (.)</option>
                      <option value="_">Underscore (_)</option>
                      <option value="">None</option>
                    </select>
                  </div>
                </div>
                <div class="option-row">
                  <label class="toggle">
                  <input id="pw-capitalize" type="checkbox" checked />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">Capitalize words</span>
                </label>
                  <label class="toggle">
                  <input id="pw-number" type="checkbox" checked />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">Add a digit</span>
                </label>
                </div>
              </div>
              <div class="option-field">
                <label for="pw-count">How many (1-50)</label>
                <input id="pw-count" type="number" min="1" max="50" value="1" inputmode="numeric" />
              </div>
              <div class="option-field">
                <label for="pw-output">Generated</label>
                <textarea id="pw-output" class="code-output" rows="4" readonly spellcheck="false" autocomplete="off"></textarea>
              </div>
              <div class="option-field">
                <label for="pw-meter">Strength</label>
                <meter id="pw-meter" min="0" max="128" low="36" high="60" optimum="128" value="0"></meter>
                <small id="pw-strength" aria-live="polite"></small>
              </div>
              <div class="result-actions">
                <button type="button" class="primary-button" id="pw-generate">Generate new</button>
                <button type="button" class="secondary-button" id="pw-copy">Copy</button>
              </div>
            </div>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
