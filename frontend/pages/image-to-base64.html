<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f6f0" />
    <meta name="description" content="Turn any image into raw Base64 or a ready-to-paste data URI. Runs entirely in your browser." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tools.oyinlola.site/tools/image-to-base64" />
    <meta property="og:title" content="Image to Base64 - Utils-tool" />
    <meta property="og:description" content="Turn any image into raw Base64 or a ready-to-paste data URI. Runs entirely in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Utils-tool" />
    <meta property="og:url" content="https://tools.oyinlola.site/tools/image-to-base64" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Image to Base64 - Utils-tool</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/brand/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/brand/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <script type="module" src="/static/assets/js/error-boundary.js"></script>
    <link rel="stylesheet" href="/static/assets/css/reset.css" />
    <link rel="stylesheet" href="/static/assets/css/variables.css" />
    <link rel="stylesheet" href="/static/assets/css/base.css" />
    <link rel="stylesheet" href="/static/assets/css/components.css" />
    <link rel="stylesheet" href="/static/assets/css/shell.css" />
    <link rel="stylesheet" href="/static/assets/css/responsive.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Developer tool</span>
            <h1>Convert images to Base64.</h1>
            <p class="hero-description">Turn any image into raw Base64 or a ready-to-paste data URI. Runs entirely in your browser.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            <div id="tool-upload" data-accept="image/*" data-hint="Any image up to 25 MB"></div>
            <div class="tool-options" id="tool-options">
<div class="option-field">
              <label for="base64-type">Output type</label>
              <select id="base64-type" class="select-input">
                <option value="data-uri" selected>Data URI — includes prefix</option>
                <option value="raw">Raw Base64 — no prefix</option>
              </select>
            </div>
            <div class="option-field">
              <label for="base64-output">Output</label>
              <textarea id="base64-output" class="code-output" readonly placeholder="Choose an image to generate its Base64 representation."></textarea>
            </div>
            <div class="result-actions">
              <button type="button" class="primary-button copy-button" id="base64-copy">Copy to clipboard</button>
            </div>
            </div>
            <button type="button" class="primary-button tool-run hidden" id="tool-run" disabled></button>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/static/assets/js/pages/image-to-base64.js"></script>
    <script defer src="/static/assets/js/vercel-analytics.js"></script>
  </body>
</html>
