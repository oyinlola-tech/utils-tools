    <link rel="icon" type="image/svg+xml" href="/static/assets/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/brand/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/brand/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>
  <body>

    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Developer tool</span>
            <h1>JWT Decoder</h1>
            <p class="hero-description">Decode JSON Web Token headers and payloads safely without sending secret keys.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            <textarea id="jwt-input" class="jwt-input-box" placeholder="Paste your JWT token here (eyJhbGciOi...)"></textarea>
            <button type="button" class="primary-button tool-run" id="tool-run">Decode Token</button>

            <div id="jwt-output" class="jwt-sections hidden">
              <div class="jwt-card">
                <h3>Header</h3>
                <pre id="jwt-header-json">{}</pre>
              </div>
              <div class="jwt-card">
                <h3>Payload</h3>
                <pre id="jwt-payload-json">{}</pre>
              </div>
            </div>

            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/static/assets/js/pages/jwt-decoder.js"></script>
    <script defer src="/static/assets/js/vercel-analytics.js"></script>
