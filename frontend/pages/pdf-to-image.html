<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f6f0" />
    <meta name="description" content="Rasterize every PDF page to JPG or PNG with a chosen DPI. Pages arrive in a ZIP archive." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tools.oyinlola.site/tools/pdf-to-image" />
    <meta property="og:title" content="PDF to Image - Utils-tool" />
    <meta property="og:description" content="Rasterize every PDF page to JPG or PNG with a chosen DPI. Pages arrive in a ZIP archive." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Utils-tool" />
    <meta property="og:url" content="https://tools.oyinlola.site/tools/pdf-to-image" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>PDF to Image - Utils-tool</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/brand/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/brand/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <script type="module" src="/static/assets/js/error-boundary.js"></script>
    <link rel="stylesheet" href="/static/assets/css/reset.css" />
    <link rel="stylesheet" href="/static/assets/css/variables.css" />
    <link rel="stylesheet" href="/static/assets/css/base.css" />
    <link rel="stylesheet" href="/static/assets/css/components.css" />
    <link rel="stylesheet" href="/static/assets/css/shell.css" />
    <link rel="stylesheet" href="/static/assets/css/responsive.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">PDF tool</span>
            <h1>Turn PDF pages into images.</h1>
            <p class="hero-description">Rasterize every PDF page to JPG or PNG with a chosen DPI. Pages arrive in a ZIP archive.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            
            <div id="tool-upload" data-accept=".pdf,application/pdf" data-multiple="false" data-max-files="1" data-hint="PDF up to 50 MB"></div>
        
            <div class="tool-options" id="tool-options">
<div class="option-row">
              <div class="option-field">
                <label for="image-format">Image format</label>
                <select id="image-format" class="select-input">
                  <option value="png" selected>PNG</option>
                  <option value="jpeg">JPG</option>
                </select>
              </div>
              <div class="option-field">
                <label for="dpi">DPI</label>
                <select id="dpi" class="select-input">
                  <option value="96">96 - screen</option>
                  <option value="150" selected>150 - balanced</option>
                  <option value="300">300 - print</option>
                </select>
              </div>
            </div>
            <div class="option-row">
              <div class="option-field">
                <label>Download</label>
                <div class="toggle-container">
                  <label class="toggle">
                    <input id="as-zip" type="checkbox" />
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                    <span class="toggle-label">Download all pages as a ZIP archive</span>
                  </label>
                </div>
              </div>
            </div>
        
            </div>
            <button type="button" class="primary-button tool-run" id="tool-run">Convert to images</button>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/static/assets/js/pages/pdf-to-image.js"></script>
    <script defer src="/static/assets/js/vercel-analytics.js"></script>
  </body>
</html>
