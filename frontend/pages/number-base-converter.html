  <body>

    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Developer tool</span>
            <h1>Number Base Converter</h1>
            <p class="hero-description">Convert integers between binary, octal, decimal, hexadecimal and any base from 2 to 36. Arbitrarily large numbers are supported.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            <div class="tool-options" id="tool-options">
              <div class="option-row">
                <label class="toggle">
                  <input id="nb-upper" type="checkbox" checked />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">Uppercase letters</span>
                </label>
                <label class="toggle">
                  <input id="nb-group" type="checkbox" />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">Group digits</span>
                </label>
              </div>
              <div class="option-field">
                <label for="nb-10">Decimal (base 10)</label>
                <input id="nb-10" data-base="10" type="text" spellcheck="false" autocomplete="off" value="255" />
              </div>
              <div class="option-field">
                <label for="nb-16">Hexadecimal (base 16)</label>
                <input id="nb-16" data-base="16" type="text" spellcheck="false" autocomplete="off" />
              </div>
              <div class="option-field">
                <label for="nb-2">Binary (base 2)</label>
                <input id="nb-2" data-base="2" type="text" spellcheck="false" autocomplete="off" />
              </div>
              <div class="option-field">
                <label for="nb-8">Octal (base 8)</label>
                <input id="nb-8" data-base="8" type="text" spellcheck="false" autocomplete="off" />
              </div>
              <div class="option-row">
                <div class="option-field">
                  <label for="nb-custom-base">Custom base</label>
                  <select id="nb-custom-base" class="select-input"></select>
                </div>
                <div class="option-field">
                  <label for="nb-custom">Value in custom base</label>
                  <input id="nb-custom" data-base="custom" type="text" spellcheck="false" autocomplete="off" />
                </div>
              </div>
              <small id="nb-info" aria-live="polite"></small>
              <div class="result-actions" id="nb-copy-actions"></div>
            </div>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
