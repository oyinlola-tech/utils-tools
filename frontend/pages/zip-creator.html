  <body>
    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">File tool</span>
            <h1>Package files into a ZIP.</h1>
            <p class="hero-description">Bundle multiple files into a single compressed archive for easy sharing.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>

            <div class="tool-options" id="tool-options">
<p class="file-hint">Files keep their original names inside the archive.</p>
        
            </div>
            <button type="button" class="primary-button tool-run" id="tool-run">Create ZIP</button>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
