<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f6f0" />
    <meta name="description" content="Prettify and validate JSON or minify it for production payloads." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tools.oyinlola.site/tools/json-formatter" />
    <meta property="og:title" content="JSON Formatter & Minifier - Utils-tool" />
    <meta property="og:description" content="Prettify and validate JSON or minify it for production payloads." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Utils-tool" />
    <meta property="og:url" content="https://tools.oyinlola.site/tools/json-formatter" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>JSON Formatter & Minifier - Utils-tool</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/brand/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/brand/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <script type="module" src="/static/assets/js/error-boundary.js"></script>
    <link rel="stylesheet" href="/static/assets/css/reset.css" />
    <link rel="stylesheet" href="/static/assets/css/variables.css" />
    <link rel="stylesheet" href="/static/assets/css/base.css" />
    <link rel="stylesheet" href="/static/assets/css/components.css" />
    <link rel="stylesheet" href="/static/assets/css/shell.css" />
    <link rel="stylesheet" href="/static/assets/css/pages.css" />
    <link rel="stylesheet" href="/static/assets/css/responsive.css" />
  </head>
  <body>

    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Developer tool</span>
            <h1>JSON Formatter & Minifier</h1>
            <p class="hero-description">Beautify, format, or minify JSON data strings.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            <div class="editor-container">
              <div class="editor-box">
                <label for="json-input"><strong>Input JSON</strong></label>
                <textarea id="json-input" class="editor-textarea" placeholder='{"key":"value","number":123}'></textarea>
              </div>
              <div class="editor-box">
                <label for="json-output"><strong>Formatted Result</strong></label>
                <textarea id="json-output" class="editor-textarea" readonly placeholder="Result will appear here..."></textarea>
              </div>
            </div>
            <div class="tool-options" id="tool-options" style="display:flex; gap:12px;">
              <button type="button" class="primary-button" id="btn-format">Beautify JSON</button>
              <button type="button" class="secondary-button" id="btn-minify">Minify JSON</button>
            </div>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/static/assets/js/pages/json-formatter.js"></script>
    <script defer src="/static/assets/js/vercel-analytics.js"></script>
  </body>
</html>
