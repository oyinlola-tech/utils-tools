  <body>
    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Utility tool</span>
            <h1>Resize for social media.</h1>
            <p class="hero-description">Pick a platform preset and your image is cropped and resized to the exact dimensions that platform expects.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            
            <div id="tool-upload" data-accept="image/*" data-multiple="false" data-max-files="1" data-hint="JPG, PNG, WebP or AVIF up to 25 MB"></div>
        
            <div class="tool-options" id="tool-options">
            <div class="option-field">
              <label for="preset-select">Platform preset</label>
              <select id="preset-select" class="select-input">
                <option value="">Loading presets…</option>
              </select>
            </div>
            <div class="option-row">
              <div class="option-field">
                <label for="social-format">Output format</label>
                <select id="social-format" class="select-input">
                  <option value="jpg" selected>JPG</option>
                  <option value="png">PNG</option>
                  <option value="webp">WebP</option>
                </select>
              </div>
            </div>
        
            </div>
            <button type="button" class="primary-button tool-run" id="tool-run">Resize for preset</button>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
