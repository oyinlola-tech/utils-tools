  <body>
    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Developer tool</span>
            <h1>Create QR codes.</h1>
            <p class="hero-description">Generate QR codes for URLs, text, emails, phone numbers or WiFi networks with custom colors and an optional logo.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            
            <div id="tool-upload" data-accept="" data-multiple="false" data-max-files="1" data-hint=""></div>
        
            <div class="tool-options" id="tool-options">
<div class="option-row">
              <div class="option-field" style="flex: 2 1 280px;">
                <label for="qr-content">Content</label>
                <input type="text" id="qr-content" placeholder="https://example.com or any text" value="https://example.com" />
              </div>
              <div class="option-field">
                <label for="qr-format">Format</label>
                <select id="qr-format" class="select-input">
                  <option value="png" selected>PNG</option>
                  <option value="webp">WebP</option>
                  <option value="svg">SVG</option>
                </select>
              </div>
            </div>
            <div class="option-row">
              <div class="option-field">
                <label for="qr-fill">Foreground</label>
                <input type="color" id="qr-fill" value="#163300" />
              </div>
              <div class="option-field">
                <label for="qr-back">Background</label>
                <input type="color" id="qr-back" value="#ffffff" />
              </div>
              <div class="option-field">
                <label for="qr-size">Size: <span id="qr-size-value">Medium</span></label>
                <input type="range" id="qr-size" min="4" max="20" value="10" />
              </div>
              <div class="option-field">
                <label for="qr-logo">Logo (optional)</label>
                <input type="file" id="qr-logo" accept="image/*" />
              </div>
            </div>
        
            </div>
            <button type="button" class="primary-button tool-run" id="tool-run">Generate QR code</button>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/static/assets/js/pages/qr-generator.js"></script>
    <script defer src="/static/assets/js/vercel-analytics.js"></script>
