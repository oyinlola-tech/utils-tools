  <body>
    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Image tool</span>
            <h1>Swap image backgrounds.</h1>
            <p class="hero-description">Remove the subject from your photo and place it on a solid color, another image or a blurred copy of itself.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            
            <div id="tool-upload" data-accept="image/*" data-multiple="false" data-max-files="1" data-hint="Image up to 25 MB"></div>
        
            <div class="tool-options" id="tool-options">
<div class="option-field">
              <label for="background-type">Background type</label>
              <select id="background-type" class="select-input">
                <option value="color" selected>Solid color</option>
                <option value="image">Image</option>
                <option value="blur">Blur</option>
              </select>
            </div>
            <div class="option-row">
              <div class="option-field" id="background-color-field">
                <label for="background-color">Color</label>
                <input type="color" id="background-color" value="#9fe870" />
              </div>
              <div class="option-field hidden" id="background-image-field">
                <label for="background-image">Background image</label>
                <input type="file" id="background-image" accept="image/*" />
              </div>
              <div class="option-field">
                <label for="background-format">Output format</label>
                <select id="background-format" class="select-input">
                  <option value="png" selected>PNG</option>
                  <option value="webp">WebP</option>
                </select>
              </div>
            </div>
            <div class="option-row" id="background-blur-field">
              <div class="option-field">
                <label for="background-blur">Blur amount: <span id="background-blur-value">0</span></label>
                <input type="range" id="background-blur" min="0" max="60" value="0" />
              </div>
            </div>
        
            </div>
            <button type="button" class="primary-button tool-run" id="tool-run">Replace background</button>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
