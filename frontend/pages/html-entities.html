<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f6f0" />
    <meta name="description" content="Encode special characters as HTML entities or decode &amp;amp;, &amp;#39; and &amp;#x27; style references back to text." />

    <link rel="canonical" href="https://tools.oyinlola.site/tools/html-entities" />
    <meta property="og:title" content="HTML Entity Encoder &amp; Decoder - Utils-tool" />
    <meta property="og:description" content="Encode special characters as HTML entities or decode &amp;amp;, &amp;#39; and &amp;#x27; style references back to text." />

    <title>HTML Entity Encoder &amp; Decoder - Utils-tool</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/brand/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/brand/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <script type="module" src="/static/assets/js/error-boundary.js"></script>
    <link rel="stylesheet" href="/static/assets/css/reset.css" />
    <link rel="stylesheet" href="/static/assets/css/variables.css" />
    <link rel="stylesheet" href="/static/assets/css/base.css" />
    <link rel="stylesheet" href="/static/assets/css/components.css" />
    <link rel="stylesheet" href="/static/assets/css/shell.css" />
    <link rel="stylesheet" href="/static/assets/css/pages.css" />
    <link rel="stylesheet" href="/static/assets/css/responsive.css" />
  </head>
  <body>

    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Developer tool</span>
            <h1>HTML Entity Encoder &amp; Decoder</h1>
            <p class="hero-description">Escape text for safe use in HTML, or decode named, decimal and hex character references back to plain characters.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            <div class="tool-options" id="tool-options">
              <div class="option-row">
                <div class="option-field">
                  <span class="option-label" id="ent-mode-label">Mode</span>
                  <div class="segmented" role="group" aria-labelledby="ent-mode-label" id="ent-mode">
                    <button type="button" data-value="encode" class="active">Encode</button>
                    <button type="button" data-value="decode">Decode</button>
                  </div>
                </div>
                <div class="option-field" id="ent-style-field">
                  <label for="ent-style">What to encode</label>
                  <select id="ent-style" class="select-input">
                    <option value="basic" selected>Only &amp; &lt; &gt; " '</option>
                    <option value="named">Also non-ASCII, as named entities</option>
                    <option value="hex">Also non-ASCII, as hex (&amp;#xE9;)</option>
                    <option value="decimal">Also non-ASCII, as decimal (&amp;#233;)</option>
                  </select>
                </div>
              </div>
              <div class="option-field">
                <label for="ent-input" id="ent-input-label">Text to encode</label>
                <textarea id="ent-input" class="code-output" rows="6" spellcheck="false">&lt;p class="note"&gt;Café &amp; crème brûlée: 5 &lt; 6 © 2024&lt;/p&gt;</textarea>
              </div>
              <div class="option-field">
                <label for="ent-output" id="ent-output-label">Encoded output</label>
                <textarea id="ent-output" class="code-output" rows="6" readonly spellcheck="false"></textarea>
              </div>
              <div class="result-actions">
                <button type="button" class="primary-button" id="ent-copy">Copy output</button>
                <button type="button" class="secondary-button" id="ent-swap">Swap input and output</button>
              </div>
            </div>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/static/assets/js/pages/html-entities.js"></script>
    <script defer src="/static/assets/js/vercel-analytics.js"></script>
  </body>
</html>
