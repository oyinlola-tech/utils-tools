  <body>
    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Utility tool</span>
            <h1>Frame your screenshots.</h1>
            <p class="hero-description">Add padding, rounded corners, a background and a shadow to make screenshots look polished. Runs entirely in your browser.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            
            <div id="tool-upload" data-accept="image/*" data-multiple="false" data-max-files="1" data-hint="Runs entirely in your browser - nothing is uploaded"></div>
        
            <div class="tool-options" id="tool-options">
<div class="option-row">
              <div class="option-field">
                <label for="shot-padding">Padding: <span id="shot-padding-value">48</span></label>
                <input type="range" id="shot-padding" min="0" max="160" value="48" />
              </div>
              <div class="option-field">
                <label for="shot-radius">Corners: <span id="shot-radius-value">16</span></label>
                <input type="range" id="shot-radius" min="0" max="80" value="16" />
              </div>
              <div class="option-field">
                <label for="shot-color">Background</label>
                <input type="color" id="shot-color" value="#163300" />
              </div>
              <div class="option-field">
                <label for="shot-shadow">Shadow</label>
                <select id="shot-shadow" class="select-input">
                  <option value="true" selected>Yes</option>
                  <option value="false">No</option>
                </select>
              </div>
            </div>
            <div class="canvas-frame" id="shot-canvas-frame"></div>
            </div>
            <button type="button" class="primary-button tool-run" id="tool-run">Export screenshot</button>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/static/assets/js/pages/screenshot-beautifier.js"></script>
