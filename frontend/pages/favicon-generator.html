<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f6f0" />
    <meta name="description" content="Create ICO and PNG favicons in every common size from a single image." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tools.oyinlola.site/tools/favicon-generator" />
    <meta property="og:title" content="Favicon Generator - Utils-tool" />
    <meta property="og:description" content="Create ICO and PNG favicons in every common size from a single image." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Utils-tool" />
    <meta property="og:url" content="https://tools.oyinlola.site/tools/favicon-generator" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Favicon Generator - Utils-tool</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/brand/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/brand/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <script type="module" src="/static/assets/js/error-boundary.js"></script>
    <link rel="stylesheet" href="/static/assets/css/reset.css" />
    <link rel="stylesheet" href="/static/assets/css/variables.css" />
    <link rel="stylesheet" href="/static/assets/css/base.css" />
    <link rel="stylesheet" href="/static/assets/css/components.css" />
    <link rel="stylesheet" href="/static/assets/css/shell.css" />
    <link rel="stylesheet" href="/static/assets/css/responsive.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Developer tool</span>
            <h1>Generate a favicon set.</h1>
            <p class="hero-description">Create ICO and PNG favicons in every common size from a single image.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            
            <div id="tool-upload" data-accept="image/*" data-multiple="false" data-max-files="1" data-hint="Image up to 25 MB"></div>
        
            <div class="tool-options" id="tool-options">
<div class="option-row">
              <div class="option-field">
                <label for="favicon-size">Largest PNG size</label>
                <select id="favicon-size" class="select-input">
                  <option value="32">32</option>
                  <option value="48">48</option>
                  <option value="64" selected>64</option>
                  <option value="128">128</option>
                  <option value="180">180 (apple touch)</option>
                  <option value="256">256</option>
                </select>
              </div>
              <div class="option-field">
                <label for="favicon-padding">Add padding</label>
                <select id="favicon-padding" class="select-input">
                  <option value="false">No</option>
                  <option value="true">Yes</option>
                </select>
              </div>
            </div>
            <p class="file-hint">Downloads a ZIP with favicon.ico (16, 32, 48) plus your chosen PNG size.</p>
        
            </div>
            <button type="button" class="primary-button tool-run" id="tool-run">Generate favicons</button>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/static/assets/js/pages/favicon-generator.js"></script>
    <script defer src="/static/assets/js/vercel-analytics.js"></script>
  </body>
</html>
