  <body>

    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Developer tool</span>
            <h1>Base64 Encoder &amp; Decoder</h1>
            <p class="hero-description">Encode text to Base64 or decode Base64 back to text. Full UTF-8 support, emoji included, plus the URL-safe Base64url variant.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            <div class="tool-options" id="tool-options">
              <div class="option-row">
                <div class="option-field">
                  <span class="option-label" id="b64-mode-label">Mode</span>
                  <div class="segmented" role="group" aria-labelledby="b64-mode-label" id="b64-mode">
                    <button type="button" data-value="encode" class="active">Encode</button>
                    <button type="button" data-value="decode">Decode</button>
                  </div>
                </div>
                <div class="option-field">
                  <span class="option-label">Variant</span>
                  <label class="toggle">
                  <input id="b64-urlsafe" type="checkbox" />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">URL-safe (Base64url, no padding)</span>
                </label>
                </div>
              </div>
              <div class="option-field">
                <label for="b64-input" id="b64-input-label">Text to encode</label>
                <textarea id="b64-input" class="code-output" rows="6" spellcheck="false">Hello, world! 👋 Ünïcödé works too.</textarea>
              </div>
              <div class="option-field">
                <label for="b64-output" id="b64-output-label">Base64 output</label>
                <textarea id="b64-output" class="code-output" rows="6" readonly spellcheck="false"></textarea>
                <small id="b64-meta" aria-live="polite"></small>
              </div>
              <div class="result-actions">
                <button type="button" class="primary-button" id="b64-copy">Copy output</button>
                <button type="button" class="secondary-button" id="b64-swap">Swap input and output</button>
                <button type="button" class="secondary-button" id="b64-clear">Clear</button>
              </div>
            </div>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
