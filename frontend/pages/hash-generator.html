  <body>

    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Developer tool</span>
            <h1>Hash Generator</h1>
            <p class="hero-description">Compute MD5, SHA-1, SHA-256, SHA-384 and SHA-512 hashes, or HMACs, of text or files. Files are hashed locally and never uploaded.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            <div class="tool-options" id="tool-options">
              <div class="option-field">
                <span class="option-label" id="hash-source-label">Input</span>
                <div class="segmented" role="group" aria-labelledby="hash-source-label" id="hash-source">
                  <button type="button" data-value="text" class="active">Text</button>
                  <button type="button" data-value="file">File</button>
                </div>
              </div>
              <div class="option-field" id="hash-text-panel">
                <label for="hash-text">Text to hash (UTF-8)</label>
                <textarea id="hash-text" class="code-output" rows="5" spellcheck="false">The quick brown fox jumps over the lazy dog</textarea>
              </div>
              <div class="option-field hidden" id="hash-file-panel">
                <label for="hash-file">File to hash (or drop it here)</label>
                <input id="hash-file" type="file" />
                <small id="hash-file-info" aria-live="polite">No file selected. Any size works; very large files need enough free memory.</small>
              </div>
              <div class="option-row">
                <div class="option-field">
                  <label for="hash-format">Output format</label>
                  <select id="hash-format" class="select-input">
                    <option value="hex" selected>Hex (lowercase)</option>
                    <option value="HEX">Hex (uppercase)</option>
                    <option value="base64">Base64</option>
                  </select>
                </div>
                <div class="option-field">
                  <label for="hash-key">HMAC secret key (optional)</label>
                  <input id="hash-key" type="text" autocomplete="off" spellcheck="false" placeholder="Leave empty for plain hashes" />
                </div>
              </div>
              <div id="hash-results" aria-live="polite"></div>
              <div class="result-actions">
                <button type="button" class="secondary-button" id="hash-copy-all">Copy all</button>
              </div>
            </div>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
