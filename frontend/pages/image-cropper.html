<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f6f0" />
    <meta name="description" content="Crop with preset ratios or free-form, and rotate or flip before exporting. Everything runs in your browser." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tools.oyinlola.site/tools/image-cropper" />
    <meta property="og:title" content="Image Cropper - Utils-tool" />
    <meta property="og:description" content="Crop with preset ratios or free-form, and rotate or flip before exporting. Everything runs in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Utils-tool" />
    <meta property="og:url" content="https://tools.oyinlola.site/tools/image-cropper" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Image Cropper - Utils-tool</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/brand/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/brand/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <script type="module" src="/static/assets/js/error-boundary.js"></script>
    <link rel="stylesheet" href="/static/assets/css/reset.css" />
    <link rel="stylesheet" href="/static/assets/css/variables.css" />
    <link rel="stylesheet" href="/static/assets/css/base.css" />
    <link rel="stylesheet" href="/static/assets/css/components.css" />
    <link rel="stylesheet" href="/static/assets/css/shell.css" />
    <link rel="stylesheet" href="/static/assets/css/responsive.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Image tool</span>
            <h1>Crop, rotate and flip images.</h1>
            <p class="hero-description">Crop with preset ratios or free-form, and rotate or flip before exporting. Everything runs in your browser.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            
            <div id="tool-upload" data-accept="image/*" data-multiple="false" data-max-files="1" data-hint="Runs entirely in your browser - nothing is uploaded"></div>
        
            <div class="tool-options" id="tool-options">
<div class="option-field">
              <label for="crop-ratio">Aspect ratio</label>
              <select id="crop-ratio" class="select-input">
                <option value="free" selected>Free</option>
                <option value="1:1">1:1</option>
                <option value="4:5">4:5</option>
                <option value="16:9">16:9</option>
                <option value="9:16">9:16</option>
                <option value="3:2">3:2</option>
              </select>
            </div>
            <div class="rotate-flip-actions">
              <button type="button" id="rotate-left">Rotate left</button>
              <button type="button" id="rotate-right">Rotate right</button>
              <button type="button" id="flip-h">Flip horizontal</button>
              <button type="button" id="flip-v">Flip vertical</button>
            </div>
            <div class="canvas-frame" id="crop-canvas-frame"></div>
            </div>
            <button type="button" class="primary-button tool-run" id="tool-run">Export cropped image</button>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/static/assets/js/pages/image-cropper.js"></script>
    <script defer src="/static/assets/js/vercel-analytics.js"></script>
  </body>
</html>
