<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f6f0" />
    <meta name="description" content="Test JavaScript regular expressions with live match highlighting, capture groups, flags and replacement preview." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tools.oyinlola.site/tools/regex-tester" />
    <meta property="og:title" content="Regex Tester - Utils-tool" />
    <meta property="og:description" content="Test JavaScript regular expressions with live match highlighting, capture groups, flags and replacement preview." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Utils-tool" />
    <meta property="og:url" content="https://tools.oyinlola.site/tools/regex-tester" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Regex Tester - Utils-tool</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/brand/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/brand/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <script type="module" src="/static/assets/js/error-boundary.js"></script>
    <link rel="stylesheet" href="/static/assets/css/reset.css" />
    <link rel="stylesheet" href="/static/assets/css/variables.css" />
    <link rel="stylesheet" href="/static/assets/css/base.css" />
    <link rel="stylesheet" href="/static/assets/css/components.css" />
    <link rel="stylesheet" href="/static/assets/css/shell.css" />
    <link rel="stylesheet" href="/static/assets/css/pages.css" />
    <link rel="stylesheet" href="/static/assets/css/responsive.css" />
    <style>.devtool-pre{white-space:pre-wrap;overflow-wrap:anywhere;min-height:80px}fieldset.option-field{border:0;padding:0;margin:0}</style>
  </head>
  <body>

    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">Developer tool</span>
            <h1>Regex Tester</h1>
            <p class="hero-description">Test JavaScript regular expressions live. Matches are highlighted, capture groups (including named ones) are listed, and you can preview replacements.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            <div class="tool-options" id="tool-options">
              <div class="option-field">
                <label for="rx-pattern">Regular expression (without slashes)</label>
                <input id="rx-pattern" type="text" spellcheck="false" autocomplete="off" value="(?&lt;user&gt;[\w.+-]+)@(?&lt;domain&gt;[\w-]+\.[\w.]+)" />
              </div>
              <fieldset class="option-field">
                <legend class="option-label">Flags</legend>
                <div class="option-row">
                  <label class="toggle">
                  <input id="rx-flag-g" type="checkbox" checked />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">g · global</span>
                </label>
                  <label class="toggle">
                  <input id="rx-flag-i" type="checkbox" />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">i · ignore case</span>
                </label>
                  <label class="toggle">
                  <input id="rx-flag-m" type="checkbox" />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">m · multiline</span>
                </label>
                  <label class="toggle">
                  <input id="rx-flag-s" type="checkbox" />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">s · dot matches newline</span>
                </label>
                  <label class="toggle">
                  <input id="rx-flag-u" type="checkbox" />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">u · unicode</span>
                </label>
                  <label class="toggle">
                  <input id="rx-flag-y" type="checkbox" />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-label">y · sticky</span>
                </label>
                </div>
              </fieldset>
              <div class="option-field">
                <label for="rx-text">Test string</label>
                <textarea id="rx-text" class="code-output" rows="6" spellcheck="false">Contact ada@example.com or grace.hopper+navy@mail.example.org.
Invalid: bob@, @example.com</textarea>
              </div>
              <div class="option-field">
                <span class="option-label" id="rx-highlight-label">Matches highlighted</span>
                <div id="rx-highlight" class="code-output devtool-pre" role="region" aria-labelledby="rx-highlight-label"></div>
                <small id="rx-summary" aria-live="polite"></small>
              </div>
              <div id="rx-matches"></div>
              <div class="result-actions">
                <button type="button" class="secondary-button" id="rx-copy-matches">Copy matches</button>
                <button type="button" class="secondary-button" id="rx-copy-literal">Copy as /regex/flags</button>
              </div>
              <div class="option-field">
                <label for="rx-replace">Replacement (supports $1, $&lt;name&gt;, $&amp;)</label>
                <input id="rx-replace" type="text" spellcheck="false" autocomplete="off" value="$&lt;user&gt; [at] $&lt;domain&gt;" />
              </div>
              <div class="option-field">
                <label for="rx-replaced">Replacement result</label>
                <textarea id="rx-replaced" class="code-output" rows="4" readonly spellcheck="false"></textarea>
              </div>
              <div class="result-actions">
                <button type="button" class="secondary-button" id="rx-copy-replaced">Copy result</button>
              </div>
            </div>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/static/assets/js/pages/regex-tester.js"></script>
    <script defer src="/static/assets/js/vercel-analytics.js"></script>
  </body>
</html>
