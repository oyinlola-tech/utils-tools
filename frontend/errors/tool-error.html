<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f6f0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="This tool hit a problem. Go back and try again, or check the file before retrying." />
    <title>Tool error — Utils-tool</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/brand/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/assets/css/reset.css" />
    <link rel="stylesheet" href="/static/assets/css/variables.css" />
    <link rel="stylesheet" href="/static/assets/css/base.css" />
    <link rel="stylesheet" href="/static/assets/css/shell.css" />
    <link rel="stylesheet" href="/static/assets/css/workbench.css" />
    <link rel="stylesheet" href="/static/assets/css/errors.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="error-page" data-status="tool-error">
      <div class="err-wrap">
        <div class="err-main">
          <p class="err-status"><span class="err-dot" aria-hidden="true"></span><span id="tool-error-status">tool error</span></p>
          <p class="err-code" aria-hidden="true" id="tool-error-code"><span>!</span></p>
          <h1 class="err-title" id="tool-error-title">This tool hit a problem.</h1>
          <p class="err-lead" id="tool-error-lead">Go back and try again, or check the file before retrying.</p>
          <p id="error-detail" class="err-detail" hidden></p>
          <div class="err-actions">
            <a href="javascript:history.back()" class="primary-button" id="tool-error-back">Back to the tool</a>
            <button type="button" class="secondary-button" data-shell-search>Search tools</button>
            <a href="/" class="err-home">Go to the home page</a>
          </div>
        </div>
        <figure class="err-dump" data-status-slug="tool_error">
          <figcaption><span>hexdump</span> the tool stopped before finishing</figcaption>
          <pre data-error-dump aria-label="The address you requested, shown as bytes"></pre>
        </figure>
      </div>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/static/assets/js/pages/error-tool.js"></script>
  </body>
</html>
