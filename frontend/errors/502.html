<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f6f0" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="An upstream server behind Utils-tool is temporarily down." />
    <title>502 · Bad gateway - Utils-tool</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/brand/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/assets/css/reset.css" />
    <link rel="stylesheet" href="/static/assets/css/variables.css" />
    <link rel="stylesheet" href="/static/assets/css/base.css" />
    <link rel="stylesheet" href="/static/assets/css/shell.css" />
    <link rel="stylesheet" href="/static/assets/css/workbench.css" />
    <link rel="stylesheet" href="/static/assets/css/errors.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="error-page">
      <div class="container error-page-inner">
        <p class="error-status" aria-hidden="true"><span class="error-status-dot"></span>status: 502 · bad_gateway</p>
        <div class="error-code" aria-hidden="true">5<span class="error-code-accent">0</span>2</div>
        <h1 class="error-title">The server behind the scenes is down.</h1>
        <p class="error-lead">
          Utils-tool couldn't get a valid response from an upstream
          server. This is usually temporary.
        </p>
        <div class="error-actions">
          <a href="javascript:location.reload()" class="primary-button">Try again</a>
          <a href="/tools" class="secondary-button">Browse tools</a>
        </div>
        <div id="error-detail" class="error-detail"></div>
        <div class="error-fix">
          <h2 class="error-fix-title">What to do next</h2>
          <ul class="error-fix-list">
            <li>Wait a moment and refresh the page.</li>
            <li>Check back in a few minutes.</li>
          </ul>
        </div>
      </div>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/static/assets/js/pages/error-page.js"></script>
  </body>
</html>
